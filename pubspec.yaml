name: cinemax_player_app
description: Cinemax Player - a standalone video player that plays any link (HLS, DASH, MP4, MKV, WebM, TS, RTSP and more).
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cinemax_player:
    path: packages/cinemax_player
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
